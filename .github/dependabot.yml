# Dependabot version updates for sample-vla-simulator-on-aws, generated by
# quinn-suite skills/validate/scripts/dependabot_rollout.py (qs-x4gs). Alerts alone never
# open PRs; this file does. Weekly; per ecosystem one PR for minor+patch, one for majors,
# one for security updates (qs-msj8). Re-run the script to regenerate after adding a manifest.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/cdk"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      pip-major:
        patterns: ["*"]
        update-types: [major]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
